target_id: local_demo
endpoint: http://127.0.0.1:8765/vulnerable/chat
policy_file: policy.yaml
corpus_dir: ../../corpus/scenarios
principal: user_alpha
auth_token_env: LLMRT_DEMO_TOKEN
profile: deterministic
